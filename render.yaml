services:
  - type: web
    name: snapstudy-api
    runtime: node
    plan: free
    region: oregon

    # Build: install all deps (including sharp native binaries)
    buildCommand: npm install --include=optional

    # Start: run the Express server directly
    startCommand: node server/index.js

    # Health check — Render uses this to confirm the service is up
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000             # Render assigns this automatically, but explicit is fine

      # ── Gemini ───────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false              # Set manually in Render dashboard
      - key: GEMINI_API_KEY_DETECT
        sync: false              # Set manually in Render dashboard
      - key: GEMINI_API_KEY_GENERATE
        sync: false              # Set manually in Render dashboard
      - key: GEMINI_API_KEY_REMEDIATE
        sync: false              # Set manually in Render dashboard

      - key: MODEL_BATCH
        value: gemini-2.5-flash

      - key: MODEL_LIVE
        value: gemini-2.5-flash

      # ── CORS ─────────────────────────────────────────────────────────────
      # Set CLIENT_ORIGIN to your Vercel URL
      # e.g. https://snapstudy-ten.vercel.app
      - key: CLIENT_ORIGIN
        value: https://snapstudy-ten.vercel.app
